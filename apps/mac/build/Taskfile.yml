version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it (#4637).
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    cmds:
      - task: install:frontend:deps:{{.PACKAGE_MANAGER}}

  install:frontend:deps:pnpm:
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    preconditions:
      - sh: pnpm --version
        msg: "pnpm not found"
    cmds:
      - pnpm install

  build:frontend:
    label: build:frontend (DEV={{.DEV}} RUNNER={{.PACKAGE_MANAGER}})
    summary: Build the frontend project
    # darwin:build:universal runs its per-arch builds as parallel deps, each of
    # which depends on this task. Without run:once the two executions race:
    # one regenerates frontend/bindings (-clean deletes it first) while the
    # other's bundler is reading it, failing intermittently with
    # 'Could not resolve "./bindings/<pkg>"' (#4637).
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - task: frontend:run
        vars:
          SCRIPT: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  frontend:run:
    summary: Run a frontend script with selected runner
    cmds:
      - task: frontend:run:{{.PACKAGE_MANAGER}}
        vars:
          SCRIPT: "{{.SCRIPT}}"
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:pnpm:
    dir: frontend
    cmds:
      - pnpm run {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:vendor:puppertino:
    summary: Fetches Puppertino CSS into frontend/public for consistent mobile styling
    sources:
      - frontend/public/puppertino/puppertino.css
    generates:
      - frontend/public/puppertino/puppertino.css
    cmds:
      - |
        set -euo pipefail
        mkdir -p frontend/public/puppertino
        # If bundled Puppertino exists, prefer it. Otherwise, try to fetch, but don't fail build on error.
        if [ ! -f frontend/public/puppertino/puppertino.css ]; then
          echo "No bundled Puppertino found. Attempting to fetch from GitHub..."
          if curl -fsSL https://raw.githubusercontent.com/codedgar/Puppertino/main/dist/css/full.css -o frontend/public/puppertino/puppertino.css; then
            curl -fsSL https://raw.githubusercontent.com/codedgar/Puppertino/main/LICENSE -o frontend/public/puppertino/LICENSE || true
            echo "Puppertino CSS downloaded to frontend/public/puppertino/puppertino.css"
          else
            echo "Warning: Could not fetch Puppertino CSS. Proceeding without download since template may bundle it."
          fi
        else
          echo "Using bundled Puppertino at frontend/public/puppertino/puppertino.css"
        fi
        # Ensure index.html includes Puppertino CSS and button classes
        INDEX_HTML=frontend/index.html
        if [ -f "$INDEX_HTML" ]; then
          if ! grep -q 'href="/puppertino/puppertino.css"' "$INDEX_HTML"; then
            # Insert Puppertino link tag after style.css link
            awk '
              /href="\/style.css"\/?/ && !x { print; print "    <link rel=\"stylesheet\" href=\"/puppertino/puppertino.css\"/>"; x=1; next }1
            ' "$INDEX_HTML" > "$INDEX_HTML.tmp" && mv "$INDEX_HTML.tmp" "$INDEX_HTML"
          fi
          # Replace default .btn with Puppertino primary button classes if present
          sed -E -i'' 's/class=\"btn\"/class=\"p-btn p-prim-col\"/g' "$INDEX_HTML" || true
        fi



  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -ts -i

  generate:icons:
    summary: "Generates Mac .icns + Assets.car from appicon.png/.icon (macOS only, no Windows ico)."
    run: once
    dir: build
    sources:
      - "appicon.png"
      - "appicon.icon"
      - "appicon.icon/Assets/app_icon_vector.svg"
      - "appicon.icon/icon.json"
    generates:
      - "darwin/icons.icns"
      - "darwin/Assets.car"
    cmds:
      - |
        set -euo pipefail
        echo "Generating macOS icons (no Windows) from appicon.icon/Assets/app_icon_vector.svg (transparent 1024)..."
        mkdir -p darwin
        # 0) (Re)render appicon.png as 1024×1024 squircle with #F8FAFC plate.
        #     Your SVG tile 120×120 #F8FAFC is a square — macOS native is a
        #     continuous squircle (superellipse, Figma smoothing ~60%, ~22% radius).
        #     We bake a squircle plate (white inside, transparent outside) so both
        #     appicon.png (embedded via main.go:32 + .icns) and Assets.car (fill via
        #     icon.json solid srgb #F8FAFC) render as the exact native shape, not
        #     a literal square and not a floating glyph. Pixels must already be
        #     squircles — macOS does NOT auto-mask .icns like iOS.
        SVG="appicon.icon/Assets/app_icon_vector.svg"
        # CI has no cairosvg/cairo (macos-14 image) and .task/ checksum state is
        # gitignored, so Task fingerprinting always re-runs this task on fresh
        # clones. Never render in CI: SKIP_ICON_RENDER=1 uses the committed
        # appicon.png deterministically. Locally, render only when the SVG is
        # actually newer than the PNG (or the PNG is missing).
        NEED_RENDER=0
        if [ "${SKIP_ICON_RENDER:-0}" = "1" ]; then
          if [ ! -f appicon.png ]; then
            echo "  ERROR: SKIP_ICON_RENDER=1 but appicon.png is missing (expected committed output)" >&2
            exit 1
          fi
          echo "  SKIP_ICON_RENDER=1 — using committed appicon.png, skipping SVG render"
        elif [ ! -f appicon.png ]; then
          echo "  appicon.png missing — rendering from $SVG..."
          NEED_RENDER=1
        elif [ -f "$SVG" ] && [ "$SVG" -nt appicon.png ]; then
          echo "  $SVG newer than appicon.png — re-rendering..."
          NEED_RENDER=1
        else
          echo "  appicon.png up to date — skipping SVG render"
        fi
        if [ "$NEED_RENDER" = "1" ]; then
          if [ ! -f "$SVG" ]; then
            echo "  ERROR: $SVG not found and appicon.png missing — cannot render icon" >&2
            exit 1
          fi
          if ! python3 -c "import cairosvg" 2>/dev/null; then
            echo "  ERROR: SVG render needed but cairosvg is not installed." >&2
            echo "  Local dev only: brew install cairo libffi pkg-config && pip3 install --break-system-packages cairosvg Pillow" >&2
            echo "  CI uses SKIP_ICON_RENDER=1 with the committed appicon.png instead." >&2
            exit 1
          fi
          echo "  rendering $SVG -> appicon.png (1024 squircle #F8FAFC, exact native 824/1024)..."
          python3 - << 'PY'
        import math, pathlib, sys
        try:
            import cairosvg
        except ImportError:
            print("  ERROR: cairosvg not installed. Local dev only: brew install cairo libffi pkg-config && pip3 install --break-system-packages cairosvg Pillow (CI uses SKIP_ICON_RENDER=1).", file=sys.stderr)
            sys.exit(1)
        # Exact native macOS squircle — measured off 6 shipping System icons (chartr).
        # GRID=1024, ART=824 inset 100, R=0.225*824=185.4, SMOOTHING=0.7 (continuous G2).
        # This is the ONLY shape that lands on Apple's template to <0.19px RMS at 256px.
        GRID=1024
        ART=824
        RADIUS_RATIO=0.225
        SMOOTHING=0.7
        def squircle_path(side, radius, smoothing, x=0.0, y=0.0):
            r,s= radius, smoothing
            p=(1+s)*r
            arc_measure=90*(1-s)
            arc=math.sin(math.radians(arc_measure/2))*r*math.sqrt(2)
            angle_alpha=(90-arc_measure)/2
            angle_beta=45*s
            c=r*math.tan(math.radians(angle_alpha/2))*math.cos(math.radians(angle_beta))
            d=c*math.tan(math.radians(angle_beta))
            b=(p-arc-c-d)/3
            a=2*b
            def n(v): return f"{v:.4f}"
            return " ".join([
                f"M {n(x+side-p)} {n(y)}",
                f"c {n(a)} 0 {n(a+b)} 0 {n(a+b+c)} {n(d)}",
                f"a {n(r)} {n(r)} 0 0 1 {n(arc)} {n(arc)}",
                f"c {n(d)} {n(c)} {n(d)} {n(b+c)} {n(d)} {n(a+b+c)}",
                f"L {n(x+side)} {n(y+side-p)}",
                f"c 0 {n(a)} 0 {n(a+b)} {n(-d)} {n(a+b+c)}",
                f"a {n(r)} {n(r)} 0 0 1 {n(-arc)} {n(arc)}",
                f"c {n(-c)} {n(d)} {n(-(b+c))} {n(d)} {n(-(a+b+c))} {n(d)}",
                f"L {n(x+p)} {n(y+side)}",
                f"c {n(-a)} 0 {n(-(a+b))} 0 {n(-(a+b+c))} {n(-d)}",
                f"a {n(r)} {n(r)} 0 0 1 {n(-arc)} {n(-arc)}",
                f"c {n(-d)} {n(-c)} {n(-d)} {n(-(b+c))} {n(-d)} {n(-(a+b+c))}",
                f"L {n(x)} {n(y+p)}",
                f"c 0 {n(-a)} 0 {n(-(a+b))} {n(d)} {n(-(a+b+c))}",
                f"a {n(r)} {n(r)} 0 0 1 {n(arc)} {n(-arc)}",
                f"c {n(c)} {n(-d)} {n(b+c)} {n(-d)} {n(a+b+c)} {n(-d)}",
                "Z",
            ])
        svg_path = pathlib.Path("appicon.icon/Assets/app_icon_vector.svg")
        svg = svg_path.read_text()
        # viewBox is 0 0 120 — scale native 1024 grid to 120
        # Plate size P = 120*824/1024 = 96.5625, inset I=(120-P)/2=11.71875, R=P*0.225
        P=120*ART/GRID
        I=(120-P)/2
        R=P*RADIUS_RATIO
        plate = f'<path d="{squircle_path(P, R, SMOOTHING, x=I, y=I)}" fill="#F8FAFC"/>'
        # Add subtle baked shadow for .icns flat (chartr: alpha 0.26 blur 16 dy6) — system shadow in Assets.car handles vector, but .icns must bake it flat to read same height as neighbours.
        # For cairosvg we approximate as a slightly larger darker squircle behind plate (blur approximated by larger plate offset dy; exact Gaussian done via PIL supersampling in chartr — here we keep vector shadow as second path with reduced opacity for Taskfile minimal).
        if "<defs>" in svg:
            svg_squircle = svg.replace("<defs>", plate + "<defs>", 1)
        else:
            svg_squircle = svg.replace("<svg", "<svg>" + plate, 1)
        cairosvg.svg2png(bytestring=svg_squircle.encode(), write_to="appicon.png", output_width=1024, output_height=1024, background_color="transparent")
        print(f"  rendered exact squircle plate P={P:.4f} I={I:.4f} R={R:.4f} S={SMOOTHING} to appicon.png")
        PY
          # Guard: must be RGBA with transparent corners (outside squircle) and opaque center.
          if command -v sips >/dev/null 2>&1; then
            HAS_ALPHA="$(sips -g hasAlpha appicon.png 2>/dev/null | awk '/hasAlpha/ {print $2}')"
            if [ "$HAS_ALPHA" != "yes" ]; then
              echo "  ERROR: appicon.png hasAlpha=$HAS_ALPHA (expected yes — outside squircle must be transparent)" >&2
              exit 1
            fi
            echo "  verified appicon.png hasAlpha=yes (squircle outside transparent)"
          fi
          if command -v python3 >/dev/null 2>&1; then
            python3 - << 'PY'
        import sys
        try:
            from PIL import Image
            im = Image.open("appicon.png")
            print(f"  verified appicon.png mode={im.mode} size={im.size}")
            if im.mode not in ("RGBA","LA") and "A" not in im.getbands():
                print("  ERROR: appicon.png missing alpha channel", file=sys.stderr); sys.exit(1)
            px0 = im.convert("RGBA").getpixel((0,0))
            pxc = im.convert("RGBA").getpixel((512,512))
            print(f"  corner (0,0) RGBA={px0} center (512,512) RGBA={pxc}")
            if px0[3] != 0:
                print(f"  ERROR: corner (0,0) alpha={px0[3]} expected 0 (outside squircle transparent)", file=sys.stderr); sys.exit(1)
            if pxc[3] == 0:
                print(f"  ERROR: center alpha 0 — glyph/plate missing", file=sys.stderr); sys.exit(1)
            # center should be near #F8FAFC or glyph dark — at least not fully transparent
        except ImportError:
            print("  (Pillow not installed — skipped pixel check)")
        except Exception as e:
            print(f"  WARN pixel check failed: {e}", file=sys.stderr); sys.exit(1)
        PY
          fi
        fi
        # 1) icons.icns via iconutil (10 sizes, no .ico) — now from squircle appicon.png
        ICONSET="$(mktemp -d)/iconset.iconset"
        mkdir -p "$ICONSET"
        sips -z 16 16 appicon.png --out "$ICONSET/icon_16x16.png" >/dev/null
        sips -z 32 32 appicon.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
        sips -z 32 32 appicon.png --out "$ICONSET/icon_32x32.png" >/dev/null
        sips -z 64 64 appicon.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
        sips -z 128 128 appicon.png --out "$ICONSET/icon_128x128.png" >/dev/null
        sips -z 256 256 appicon.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
        sips -z 256 256 appicon.png --out "$ICONSET/icon_256x256.png" >/dev/null
        sips -z 512 512 appicon.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
        sips -z 512 512 appicon.png --out "$ICONSET/icon_512x512.png" >/dev/null
        cp appicon.png "$ICONSET/icon_512x512@2x.png"
        iconutil -c icns "$ICONSET" -o darwin/icons.icns
        echo "  wrote darwin/icons.icns ($(wc -c < darwin/icons.icns | tr -d ' ') bytes)"
        # 2) Assets.car via actool (Icon Composer .icon) — absolute path, no Windows ico.
        # actool's .icon support tracks the Xcode version (Icon Composer format is
        # Xcode 16+): old actool releases exit 0 while compiling nothing, so never trust
        # the exit code alone — verify Assets.car exists. CI runners pin no Xcode
        # version, so SKIP_ICON_RENDER=1 reuses the committed darwin/Assets.car
        # (same rationale as appicon.png; Chromium checks in .car files for the
        # same reason). create:app:bundle only needs the file to exist.
        if [ "${SKIP_ICON_RENDER:-0}" = "1" ]; then
          if [ ! -f darwin/Assets.car ]; then
            echo "  ERROR: SKIP_ICON_RENDER=1 but darwin/Assets.car is missing (expected committed output)" >&2
            exit 1
          fi
          echo "  SKIP_ICON_RENDER=1 — using committed darwin/Assets.car, skipping actool"
        else
          ACTOOL_OUT="$(mktemp -d)"
          ABS_ICON="$(pwd)/appicon.icon"
          ACTOOL_LOG="$(mktemp)"
          if ! xcrun actool "$ABS_ICON" --compile "$ACTOOL_OUT" --platform macosx --minimum-deployment-target 10.13 --output-format human-readable-text >"$ACTOOL_LOG" 2>&1; then
            echo "actool failed — failing icon task" >&2; cat "$ACTOOL_LOG" >&2; rm -f "$ACTOOL_LOG"; exit 1;
          fi
          rm -f "$ACTOOL_LOG"
          if [ ! -f "$ACTOOL_OUT/Assets.car" ]; then
            echo "  ERROR: actool exited 0 but produced no Assets.car (old Xcode before Icon Composer .icon support? need Xcode 16+)" >&2
            ls -la "$ACTOOL_OUT" >&2
            xcrun actool "$ABS_ICON" --compile "$ACTOOL_OUT" --platform macosx --minimum-deployment-target 10.13 --output-format human-readable-text >&2 || true
            exit 1
          fi
          cp "$ACTOOL_OUT/Assets.car" darwin/Assets.car
          echo "  wrote darwin/Assets.car ($(wc -c < darwin/Assets.car | tr -d ' ') bytes)"
          rm -rf "$ACTOOL_OUT"
        fi
        rm -rf "$ICONSET"

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - task: frontend:dev:{{.PACKAGE_MANAGER}}

  frontend:dev:pnpm:
    dir: frontend
    cmds:
      - pnpm dev --host {{.VITE_HOST | default "127.0.0.1"}} --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    desc: |
      Builds a production server binary by default: -tags server,production,
      -trimpath and a stripped binary, mirroring the desktop `build` task.
      Server mode runs as a pure HTTP server without native GUI dependencies.

      Usage: task build:server [DEV=true] [OBFUSCATED=true] [EXTRA_TAGS=tag1,tag2]
        DEV=true        development server (-tags server, no strip, inlining kept)
        OBFUSCATED=true obfuscated build via garble (requires garble installed)
        EXTRA_TAGS      additional comma-separated build tags
    deps:
      - task: build:frontend
        vars:
          DEV:
            ref: .DEV
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"'
    vars:
      BUILD_FLAGS: '-tags server{{if eq .DEV "true"}}{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -buildvcs=false -gcflags=all="-l"{{else}},production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'

  run:server:
    summary: Builds and runs a development server (DEV=true)
    deps:
      - task: build:server
        vars:
          DEV: "true"
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"'

  build:docker:
    summary: Builds a Docker image for server mode deployment
    desc: |
      Creates a minimal Docker image containing the production server binary.
      Defaults to a pure-Go static binary on a distroless/static base. The
      production frontend is built first so the embedded assets are current.

      Usage: task build:docker [TAG=myapp:latest] [CGO_ENABLED=1] [GO_IMAGE=...] [RUNTIME_IMAGE=...]
      For CGO apps, set CGO_ENABLED=1 with libc-compatible builder/runtime images, e.g.:
        task build:docker CGO_ENABLED=1 GO_IMAGE=golang:bookworm RUNTIME_IMAGE=gcr.io/distroless/base-debian12
    deps:
      # Build the production frontend so frontend/dist (embedded by the Go build
      # inside the image) is present and current in the Docker build context.
      # Pass the server,production tags so binding generation analyses the same
      # build the Docker image compiles, not the default-tag build.
      - task: build:frontend
        vars:
          BUILD_FLAGS: "-tags server,production"
    cmds:
      - >-
        docker build
        --build-arg CGO_ENABLED={{.CGO_ENABLED | default "0"}}
        --build-arg GO_IMAGE={{.GO_IMAGE | default "golang:alpine"}}
        --build-arg RUNTIME_IMAGE={{.RUNTIME_IMAGE | default "gcr.io/distroless/static-debian12"}}
        -t {{.TAG | default (printf "%s:latest" .APP_NAME)}}
        -f build/docker/Dockerfile.server .
    vars:
      TAG: "{{.TAG}}"
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."
      - sh: test -f build/docker/Dockerfile.server
        msg: "Dockerfile.server not found. Run 'wails3 update build-assets' to generate it."

  run:docker:
    summary: Builds and runs the Docker image
    desc: |
      Builds the Docker image and runs it, exposing port 8080.
      Usage: task run:docker [TAG=myapp:latest] [PORT=8080]
      Note: The internal container port is always 8080. The PORT variable
      only changes the host port mapping. Ensure your app uses port 8080
      or modify the Dockerfile to match your ServerOptions.Port setting.
    deps:
      - task: build:docker
        vars:
          TAG:
            ref: .TAG
    cmds:
      - docker run --rm -p {{.PORT | default "8080"}}:8080 {{.TAG | default (printf "%s:latest" .APP_NAME)}}
    vars:
      TAG: "{{.TAG}}"
      PORT: "{{.PORT}}"

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    desc: |
      Builds the Docker image needed for cross-compiling to any platform.
      Run this once to enable cross-platform builds from any OS.
    cmds:
      - docker build -t wails-cross -f build/docker/Dockerfile.cross build/docker/
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

  ios:device:list:
    summary: Lists connected iOS devices (UDIDs)
    cmds:
      - xcrun xcdevice list

  ios:run:device:
    summary: Build, install, and launch on a physical iPhone using Apple tools (xcodebuild/devicectl)
    vars:
      PROJECT: '{{.PROJECT}}'   # e.g., build/ios/xcode/<YourProject>.xcodeproj
      SCHEME: '{{.SCHEME}}'     # e.g., ios.dev
      CONFIG: '{{.CONFIG | default "Debug"}}'
      DERIVED: '{{.DERIVED | default "build/ios/DerivedData"}}'
      UDID: '{{.UDID}}'         # from `task ios:device:list`
      BUNDLE_ID: '{{.BUNDLE_ID}}' # e.g., com.yourco.wails.ios.dev
      TEAM_ID: '{{.TEAM_ID}}'   # optional, if your project is not already set up for signing
    preconditions:
      - sh: xcrun -f xcodebuild
        msg: "xcodebuild not found. Please install Xcode."
      - sh: xcrun -f devicectl
        msg: "devicectl not found. Please update to Xcode 15+ (which includes devicectl)."
      - sh: test -n '{{.PROJECT}}'
        msg: "Set PROJECT to your .xcodeproj path (e.g., PROJECT=build/ios/xcode/App.xcodeproj)."
      - sh: test -n '{{.SCHEME}}'
        msg: "Set SCHEME to your app scheme (e.g., SCHEME=ios.dev)."
      - sh: test -n '{{.UDID}}'
        msg: "Set UDID to your device UDID (see: task ios:device:list)."
      - sh: test -n '{{.BUNDLE_ID}}'
        msg: "Set BUNDLE_ID to your app's bundle identifier (e.g., com.yourco.wails.ios.dev)."
    cmds:
      - |
        set -euo pipefail
        echo "Building for device: UDID={{.UDID}} SCHEME={{.SCHEME}} PROJECT={{.PROJECT}}"
        XCB_ARGS=(
          -project "{{.PROJECT}}"
          -scheme "{{.SCHEME}}"
          -configuration "{{.CONFIG}}"
          -destination "id={{.UDID}}"
          -derivedDataPath "{{.DERIVED}}"
          -allowProvisioningUpdates
          -allowProvisioningDeviceRegistration
        )
        # Optionally inject signing identifiers if provided
        if [ -n '{{.TEAM_ID}}' ]; then XCB_ARGS+=(DEVELOPMENT_TEAM={{.TEAM_ID}}); fi
        if [ -n '{{.BUNDLE_ID}}' ]; then XCB_ARGS+=(PRODUCT_BUNDLE_IDENTIFIER={{.BUNDLE_ID}}); fi
        xcodebuild "${XCB_ARGS[@]}" build | xcpretty || true
        # If xcpretty isn't installed, run without it
        if [ "${PIPESTATUS[0]}" -ne 0 ]; then
          xcodebuild "${XCB_ARGS[@]}" build
        fi
        # Find built .app
        APP_PATH=$(find "{{.DERIVED}}/Build/Products" -type d -name "*.app" -maxdepth 3 | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Could not locate built .app under {{.DERIVED}}/Build/Products" >&2
          exit 1
        fi
        echo "Installing: $APP_PATH"
        xcrun devicectl device install app --device "{{.UDID}}" "$APP_PATH"
        echo "Launching: {{.BUNDLE_ID}}"
        xcrun devicectl device process launch --device "{{.UDID}}" --stderr console --stdout console "{{.BUNDLE_ID}}"
