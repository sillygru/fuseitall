<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
  <title>FuseItAll — stacked squares</title>
  <defs>
    <clipPath id="c1"><rect x="42" y="42" width="52" height="52" rx="10"/></clipPath>
    <filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>
  <rect x="26" y="26" width="52" height="52" rx="10" fill="none" stroke="#0A0A0A" stroke-width="2.8"/>
  <g clip-path="url(#c1)" opacity="0.9"><g filter="url(#b1)" opacity="0.55"><rect x="26" y="26" width="52" height="52" rx="10" fill="none" stroke="#0A0A0A" stroke-width="3.5"/></g></g>
  <rect x="42" y="42" width="52" height="52" rx="10" fill="#0A0A0A" opacity="0.88"/>
  <rect x="42" y="42" width="52" height="52" rx="10" fill="none" stroke="white" stroke-width="1" opacity="0.12"/>
</svg>
