version: '3'

tasks:
  test:
    desc: All base tests (Go race + Flutter)
    deps: [version:check, test:core, test:mac, test:bridge, test:android]

  version:check:
    desc: Fail when core/Dart/Mac versions drift from 0.1.0 baseline
    cmds:
      - python3 -c "import re,json,sys; core=open('packages/core/version.go').read(); m=re.search(r'CurrentAppVersion\s*=\s*\"([^\"]+)\"', core); assert m, 'CurrentAppVersion missing'; v=m.group(1); pub=open('apps/android/pubspec.yaml').read(); assert re.search(r'^version:\s*'+re.escape(v)+r'\+', pub, re.M), f'pubspec mismatch, want {v}'; pkg=json.load(open('apps/mac/frontend/package.json')); assert pkg.get('version')==v, f\"package.json {pkg.get('version')} != {v}\"; dart=open('apps/android/lib/version.dart').read(); assert f\"kAppVersion = '{v}'\" in dart, 'version.dart mismatch'; print(f'versions aligned at {v}')"

  test:core:
    desc: Go tests with race detector (core)
    cmds:
      - cd packages/core && go test -race -count=1 ./...

  test:mac:
    desc: Go tests with race detector (mac backend)
    cmds:
      - cd apps/mac && go test -race -count=1 ./...

  test:bridge:
    desc: Go tests with race detector (android go bridge)
    cmds:
      - cd apps/android/go_bridge && go test -race -count=1 ./...

  test:android:
    desc: Flutter analyze + tests
    cmds:
      - cd apps/android && flutter analyze && flutter test

  vet:
    desc: Go vet + gosec + govulncheck on all Go modules
    cmds:
      - cd packages/core && go vet ./...
      - cd apps/mac && go vet ./...
      - cd apps/android/go_bridge && go vet ./...
      - which gosec >/dev/null && (cd packages/core && gosec ./...) || echo "gosec not installed, skipping"
      - which govulncheck >/dev/null && (cd packages/core && govulncheck ./...) || echo "govulncheck not installed, skipping"

  lint:license:
    desc: Fail when a hand-written source file lacks the SPDX header
    cmds:
      - python3 scripts/check_license.py

  build:mac:
    desc: Production Mac build (arm64)
    cmds:
      - cd apps/mac && wails3 build

  build:android:
    desc: Rebuild Go bridge .so files for Android
    cmds:
      - sh apps/android/go_bridge/build_android.sh

  build:android:quick:
    desc: Quick debug Go bridge (arm64 only, ~8s) for flutter run --debug
    cmds:
      - sh apps/android/go_bridge/build_android.sh arm64

  dev:mac:
    desc: Mac dev with hot reload (pass 'DEMO=1' or '-- --demo' for demo mode)
    cmds:
      - cd apps/mac && {{if or (contains "--demo" .CLI_ARGS) (contains "-demo" .CLI_ARGS) (eq (default "" .DEMO) "1") (eq (default "" .DEMO) "true") (eq (env "FUSEITALL_DEMO") "1") (eq (env "DEMO") "1")}}FUSEITALL_DEMO=1 {{end}}wails3 dev

  dev:mac:demo:
    desc: Mac dev with hot reload in demo mode (mock data, no phone connection)
    cmds:
      - cd apps/mac && FUSEITALL_DEMO=1 wails3 dev
