# AGPL-3.0 header note: config file, no header needed (see AGENTS.md carve-out).
#
# Build Mac: arm64 + amd64 ad-hoc-signed zipped .app bundles on macos-14.
# Every run uploads both zips as Actions artifacts. No release job.
name: build-macos

"on":
  push: {}
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "11.25.0"
  WAILS_VERSION: "v3.0.0-beta.16"

jobs:
  build-macos:
    name: build-macos (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the icon-freshness guard can diff the push/PR range.
          fetch-depth: 0
      - name: Icon freshness guard (SVG changed without re-rendered PNG)
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit available (new branch); skipping icon freshness check"
            exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD -- apps/mac/build || true)"
          echo "$changed"
          svg_changed="$(echo "$changed" | grep -E 'apps/mac/build/(appicon\.icon/Assets/app_icon_vector\.svg|appicon\.icon/icon\.json)$' || true)"
          if [ -n "$svg_changed" ]; then
            out_changed="$(echo "$changed" | grep -E 'apps/mac/build/(appicon\.png|darwin/icons\.icns|darwin/Assets\.car)$' || true)"
            if [ -z "$out_changed" ]; then
              echo "::error::Icon SVG changed without re-rendered outputs. Run 'task common:generate:icons' locally (requires cairosvg) and commit appicon.png + darwin/icons.icns + darwin/Assets.car."
              exit 1
            fi
          fi
          echo "Icon outputs in sync with SVG sources."
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/mac/frontend/pnpm-lock.yaml
      - name: Install wails3
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frontend deps
        working-directory: apps/mac/frontend
        run: pnpm install --frozen-lockfile
      - name: Svelte typecheck
        working-directory: apps/mac/frontend
        run: pnpm check
      - name: Frontend production build
        working-directory: apps/mac/frontend
        run: pnpm build
      - name: Package .app (ad-hoc signed)
        working-directory: apps/mac
        env:
          # CI runners lack cairosvg/cairo and .task/ state is never cached,
          # so always use the committed appicon.png (see build/Taskfile.yml).
          SKIP_ICON_RENDER: "1"
        run: wails3 task darwin:package ARCH=${{ matrix.arch }}
      - name: Zip .app (preserve ad-hoc signature)
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          "apps/mac/bin/fuseitall.app"
          "FuseItAll-darwin-${{ matrix.arch }}.app.zip"
      - name: Verify artifact
        run: |
          ls -lh "FuseItAll-darwin-${{ matrix.arch }}.app.zip"
          unzip -l "FuseItAll-darwin-${{ matrix.arch }}.app.zip" | head -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: FuseItAll-darwin-${{ matrix.arch }}.app.zip
          path: FuseItAll-darwin-${{ matrix.arch }}.app.zip
          if-no-files-found: error
