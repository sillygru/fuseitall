# AGPL-3.0 header note: config file, no header needed (see AGENTS.md carve-out).
#
# Build Android: release APK for arm64-v8a only. Every run uploads the APK.
# No release job.
name: build-android

"on":
  push: {}
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"
  JAVA_VERSION: "17"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build-android:
    name: build-android (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install Android platform + NDK r27
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "ndk;${ANDROID_NDK_VERSION}"
          yes | sdkmanager --licenses > /dev/null || true
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build Go bridge (arm64-v8a only)
        run: sh apps/android/go_bridge/build_android.sh arm64
      - name: Pub get
        working-directory: apps/android
        run: flutter pub get
      - name: Build release APK (android-arm64 only)
        working-directory: apps/android
        run: flutter build apk --release --target-platform=android-arm64 --split-per-abi
      - name: Rename APK
        run: cp apps/android/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk FuseItAll-android-arm64-v8a.apk
      - name: Verify artifact
        run: ls -lh FuseItAll-android-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FuseItAll-android-arm64-v8a.apk
          path: FuseItAll-android-arm64-v8a.apk
          if-no-files-found: error
